name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Name this build
        id: version
        # The version in pubspec.yaml, marked as a CI build: 1.2.0-ci.57.
        run: |
          version=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          echo "version=$version-ci.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check generated database code is current
        run: |
          dart run build_runner build -d
          git diff --exit-code -- lib
      - run: flutter analyze
      - run: flutter test

  server:
    name: Sync server tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Run the schema twice, then its tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c 'create database srtest'
          psql -v ON_ERROR_STOP=1 -d srtest \
            -f supabase/test/stubs.sql \
            -f supabase/schema.sql -f supabase/schema.sql \
            -f supabase/test/schema_test.sql

  android:
    name: Android APK
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: ./.github/actions/android-signing
        with:
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          key-password: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: flutter build apk --release "--dart-define=APP_VERSION=$APP_VERSION"
        env:
          APP_VERSION: ${{ needs.test.outputs.version }}
      - name: Name the APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "study-reminder-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: study-reminder-android
          path: study-reminder-*.apk
          retention-days: 30

  windows:
    name: Windows app
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release "--dart-define=APP_VERSION=$env:APP_VERSION"
        shell: pwsh
        env:
          APP_VERSION: ${{ needs.test.outputs.version }}
      - id: package
        uses: ./.github/actions/windows-package
        with:
          version: ${{ needs.test.outputs.version }}
          zip-name: study-reminder-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: study-reminder-windows
          path: |
            study-reminder-windows.zip
            ${{ steps.package.outputs.installer }}
          retention-days: 30
