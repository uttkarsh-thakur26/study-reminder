name: Player check

on:
  push:
    branches: [claude/project-thread-vceyue]
    paths:
      - integration_test/**
      - tool/player_check.sh
      - .github/workflows/player-check.yml

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  emulator:
    name: YouTube player on an Android emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the test app before the emulator starts
        run: flutter build apk --debug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./tool/player_check.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: player-check
          path: player-check/
          retention-days: 7
